services:
  db:
    image: postgres:16-alpine
    container_name: todo_learn_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-todo_learn}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-todo_learn}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
